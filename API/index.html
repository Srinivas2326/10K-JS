<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User CRUD App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Display Users</h1>
  
  <div id="userdata" class="user-container"></div>

  <!-- Add User Form -->
  <div class="form-container" id="addFormContainer">
    <h2>Add New User</h2>
    <form id="addUserForm">
      <input type="text" id="addName" placeholder="Enter name" required>
      <input type="email" id="addEmail" placeholder="Enter email" required>
      <select id="addGender" required>
        <option value="">Select Gender</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
      </select>
      <select id="addStatus" required>
        <option value="">Select Status</option>
        <option value="Active">Active</option>
        <option value="Inactive">Inactive</option>
      </select>
      <button type="submit">Add User</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
