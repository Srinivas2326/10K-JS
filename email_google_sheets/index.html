<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stay Connected</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="hero">
        <h3>Hello, I'm a Web Development Enthusiast!</h3>
        <h1>Building My First<br>Interactive Website</h1>
        <p>Stay connected with me for project updates and learning progress</p>
        <form id="submit-to-google-sheet">
            <input type="email" name="Email" placeholder="Enter your email to stay updated" required>
            <button type="submit">
                <img src="email-subs-img/send-icon.png" width="30px" alt="Send Icon">
            </button>
        </form>
        <span id="msg"></span>
    </div>

    <script src="script.js"></script>
</body>

</html>
