<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Jai Ganesha Drawing</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Type "JAI GANESHA" to Draw Lord Ganesha 🙏</h1>
  <div class="controls">
    <input id="textInput" type="text" placeholder="Enter text...">
    <button id="drawBtn">Draw</button>
    <button id="resetBtn">Reset</button>
  </div>
  <p id="status"></p>
  <canvas id="ganeshaCanvas" width="400" height="500"></canvas>
  <script src="script.js"></script>
</body>
</html>
